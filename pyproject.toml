[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-schema-rewards"
version = "0.1.0"
description = "Deterministic Group Relative Policy Optimization (GRPO) reward suite for zero-markdown schema adherence in quantitative SLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VexelQuant Research", email = "research@vexelquant.me" }
]
keywords = [
    "grpo",
    "reinforcement-learning",
    "trl",
    "unsloth",
    "schema-compliance",
    "quantitative-finance",
    "slm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.urls]
Homepage = "https://vexelquant.me"
Repository = "https://github.com/VexelQuant/grpo-schema-rewards"
HuggingFace = "https://huggingface.co/VexelQuant"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]
include = ["vexel_rewards*"]
